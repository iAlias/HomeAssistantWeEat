      example: "application/pdf"
      selector:
        text:
save_draft:
  fields:
    days:
      required: true
      selector:
        object:
confirm_plan:
log_plan_meal:
  fields:
    meal:
      required: true
      selector:
        select:
          options: [colazione, spuntino, pranzo, merenda, cena]
log_extra:
  fields:
    text:
      required: true
      example: "2 fette di pizza"
      selector:
        text:
